name: CI

# Two ways in (owner, 2026-11-14):
# - Every PR runs only the guard lane (scripts/guard-lane.sh, a few minutes): the cheap checks no merge
#   may break. Drafts are skipped; a new push cancels the run before it.
#   A manual run runs it too (2026-11-17): on the public mirror there are no PRs, so that is the only way it runs there.
#   Pass the PR description as `-f pr_body=...` when it carries 「不需要更新說明」.
# - The full suites below run only when asked (2026-10-29: 「我說要跑才跑」): Actions → CI → Run workflow,
#   or `gh workflow run ci.yml --ref <branch>`. Private-repo minutes ran out in October when every push
#   ran everything, so on the private repo the heavy jobs stay manual.
# - On the public mirror (oandy-rgb/Onden-open, free minutes) every push runs the guard lane and the full suites by
#   itself (owner, 2026-11-20): each branch scripts/public-mirror/public-push.sh sends, and main after every merge.
#   The PR description it cannot see arrives as lines of the pushed commit (public-push.sh carries 「不需要更新說明」,
#   「文件不需要更新：」 and `ratchet-override:`). Only the full-stack E2E stays manual (slow).
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      fullstack:
        description: "Also run the full-stack E2E (slow)"
        type: boolean
        default: false
      pr_body:
        description: "The PR description, for the change-note check (it looks for 「不需要更新說明」)"
        type: string
        default: ""
      extended:
        description: "Also run the scheduled set: daily (fuzz, browser version, layout audit…) or weekly (mutation, long property runs, census, bench)"
        type: choice
        options: ["", daily, weekly]
        default: ""

# Cancel superseded runs on the same ref to save CI minutes.
# Main is not cancelled: every merge synced to the public main keeps its own result.
# A scheduled run (`extended`) has a group of its own: sharing main's would let it hold the group while a merge's push run
# waits, and a dispatch waiting behind a push run would be cancelled by the next push, leaving a night with no report.
concurrency:
  group: ci-${{ github.ref }}${{ inputs.extended && format('-{0}', inputs.extended) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !inputs.extended }}

jobs:
  # Same tree already green? (scripts/ci/sameTreeReceipt.sh) A finished run of this same git tree with every required job green
  # is this run's receipt: the heavy jobs below skip and the summary names the run. Not for PRs, scheduled runs or the full e2e.
  receipt:
    name: Same tree already green?
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      reused: ${{ steps.look.outputs.reused }}
      from: ${{ steps.look.outputs.from }}
    steps:
      - uses: actions/checkout@v4
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
          ELIGIBLE: ${{ github.repository == 'oandy-rgb/Onden-open' && github.event_name != 'pull_request' && !inputs.extended }}
        run: bash scripts/ci/sameTreeReceipt.sh

  guard:
    name: Guard lane
    runs-on: ubuntu-latest
    # On a PR, and on a manual run: the public mirror has no PRs, its branches are pushed by scripts/public-mirror/public-push.sh
    # and started by hand, so without the second half this job never ran there and the lane stayed on a laptop.
    needs: receipt
    if: needs.receipt.outputs.reused != 'true' && ((github.event_name == 'pull_request' && !github.event.pull_request.draft) || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.repository == 'oandy-rgb/Onden-open'))
    timeout-minutes: 20
    steps:
      # The ratchet and change-note checks compare against origin/main, so they need history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # PR_BODY lets the change-note check see 「不需要更新說明」 in the PR description (scripts/changes.mjs),
      # so an internal-only PR passes without writing a note users would then be shown.
      - name: Guard lane
        env:
          PR_BODY: ${{ github.event.pull_request.body || inputs.pr_body || github.event.head_commit.message }}
        run: bash scripts/guard-lane.sh

  pairing-relay:
    name: Pairing and relay — typecheck · unit
    runs-on: ubuntu-latest
    needs: receipt
    if: needs.receipt.outputs.reused != 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.repository == 'oandy-rgb/Onden-open'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pairing typecheck and tests
        working-directory: packages/pairing
        run: npx tsc --noEmit && npx vitest run

      - name: Relay typecheck and tests (local Workers runtime, no account)
        working-directory: packages/relay
        run: npx tsc --noEmit && npx vitest run

  backend:
    name: Backend — lint · typecheck · unit
    runs-on: ubuntu-latest
    needs: receipt
    if: needs.receipt.outputs.reused != 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.repository == 'oandy-rgb/Onden-open'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches packages/backend/docker/Dockerfile
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (read-gate forcing function)
        working-directory: packages/backend
        run: npm run lint

      - name: Typecheck
        working-directory: packages/backend
        run: npx tsc --noEmit

      # An explicit no-database run (ONDEN_TESTS_WITHOUT_DATABASE=1): the
      # integration files skip themselves and the run says so at the end. Any
      # other run without a database fails (scripts/lib/skipGateReporter.mjs).
      - name: Unit tests (no database)
        working-directory: packages/backend
        run: npm run test:no-db

      # The files that mean something only on PGlite (POSTGRES_SKIPS in src/test/helpers/pgliteSkipList.ts: the
      # real-Postgres shards skip them by name). Without this step no job ran them at all: on 2026-11-17 a tag-name
      # rule broke one of them on main and every job was green. Read from the list, so a new entry runs here too.
      - name: Tests that only run on PGlite
        working-directory: packages/backend
        env:
          ONDEN_DB_DRIVER: pglite
          DATABASE_URL: postgres://x@localhost/onden_cloud_test
        run: |
          files=$(sed -n '/export const POSTGRES_SKIPS/,/^};/p' src/test/helpers/pgliteSkipList.ts | grep -o '"src/test/[^"]*"' | tr -d '"')
          [ -n "$files" ] || { echo "POSTGRES_SKIPS could not be read"; exit 1; }
          for f in $files; do [ -f "$f" ] || { echo "POSTGRES_SKIPS names a file that does not exist: $f"; exit 1; }; done
          npx vitest run --maxWorkers=2 $files

  # The DB-gated files against a real Postgres, in four shards side by side: the files run one at a time (they share
  # one test database), so a single job took 52 minutes on a hosted 2-core runner (2026-11-15). Each shard has its own
  # Postgres; a skipped test fails its shard (src/test/helpers/pgliteSkipList.ts names the few that are PGlite-only).
  backend-postgres:
    name: Backend — real Postgres (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: receipt
    if: needs.receipt.outputs.reused != 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.repository == 'oandy-rgb/Onden-open'))
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The schema needs extensions a stock Postgres image doesn't ship:
      # pgroonga (FTS), pg_stat_statements (shared_preload), pgvector,
      # pgcrypto. Build the same custom image compose uses.
      - name: Build Postgres image
        run: docker build -t onden-postgres ./docker/postgres

      - name: Start Postgres
        run: |
          docker run -d --name onden-pg \
            -p 5432:5432 \
            -e POSTGRES_DB=onden \
            -e POSTGRES_USER=onden \
            -e POSTGRES_PASSWORD=onden \
            -v "$PWD/packages/backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro" \
            onden-postgres \
            postgres -c shared_preload_libraries='pg_stat_statements'

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 60); do
            # Over TCP on purpose: while the image initialises, a temporary server answers on the unix socket only and
            # is then shut down. Accepting that one let the next step start loading the schema into a server that was
            # stopping ("the database system is shutting down", twice on 2026-11-15/16). The real server listens on TCP.
            if docker exec onden-pg pg_isready -h 127.0.0.1 -U onden -d onden >/dev/null 2>&1; then
              echo "Postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "Postgres never became ready"; docker logs onden-pg; exit 1

      # schema.sql is the GENERATED current snapshot (it pre-seeds
      # schema_migrations), so onden_test = just load it — fast, no migration
      # replay. The migration chain IS runnable from an empty DB (asserted by
      # migration.integration.test.ts), but replaying it here would double-apply
      # onto the already-current schema; loading the snapshot is the right path
      # for a fresh DB and migrate() then applies only NEWER migrations
      # incrementally on existing deployments.
      - name: Build onden_test schema (load the generated schema.sql)
        run: |
          docker exec onden-pg psql -U onden -d onden -c "CREATE DATABASE onden_test;"
          docker exec -i onden-pg psql -U onden -d onden_test -v ON_ERROR_STOP=1 -q \
            -f /docker-entrypoint-initdb.d/01_schema.sql

      # The real value: every DB-gated file (integration, properties, backup
      # round trips…) runs against a real Postgres with the actual schema +
      # triggers (capture_node_version, the spine path, JOINs). The whole suite,
      # not a glob: `src/test/*.integration.test.ts` missed ~35 gated files.
      # A skipped test fails this step (src/test/helpers/pgliteSkipList.ts names
      # the few that are PGlite-only).
      - name: Suite on real Postgres (shard ${{ matrix.shard }} of 4)
        working-directory: packages/backend
        env:
          DATABASE_URL: postgres://onden:onden@localhost:5432/onden_test
        run: npx vitest run --shard=${{ matrix.shard }}/4

      # Real client stack (frontend) against the real backend on this database:
      # the multi-device sync fault simulation (a network that drops, duplicates
      # and delays requests) and every other frontend file that needs a database.
      # Found by the same rule the frontend's skip gate uses (the file reads
      # process.env.DATABASE_URL), not listed: a new database-gated file runs
      # here without touching this step. It reads the schema the run above built.
      - name: Frontend tests that need a database
        if: matrix.shard == 1
        working-directory: packages/frontend
        env:
          DATABASE_URL: postgres://onden:onden@localhost:5432/onden_test
        run: npx vitest run $(grep -rl --include='*.test.ts' --include='*.test.tsx' 'process.env.DATABASE_URL' src)

      - name: Postgres logs (on failure)
        if: failure()
        run: docker logs onden-pg

  # The restore and upgrade scripts the way the servers run them (PR #1937, review round 2, point 2): scripts/restore.sh in compose mode on
  # the repo's compose.yaml and Postgres image (PG 18 with pgroonga) with a pg_dump -Fc backup-vps folder; the fake-docker self-test of
  # upgrade.sh / rollback; and the restore drill's self-test against the same image (host client tools of the same major version).
  restore-scripts:
    name: Restore scripts — compose · pg_dump -Fc · PG 18 + pgroonga
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Postgres image
        run: docker build -t onden-ci-postgres:selftest ./docker/postgres

      - name: restore.sh in compose mode, pg_dump -Fc folder (scripts/restore-ci-selftest.sh)
        env:
          REQUIRE_PGROONGA: "1"
        run: bash scripts/restore-ci-selftest.sh

      - name: upgrade.sh / rollback against a fake docker (scripts/upgrade-selftest.sh)
        run: bash scripts/upgrade-selftest.sh

      # The drill runs pg_dump / pg_restore on the host: they must be the server's major version (18), which the runner does not ship.
      - name: PostgreSQL 18 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Start Postgres for the drill
        run: |
          docker run -d --name onden-drill-pg -p 5432:5432 -e POSTGRES_DB=postgres -e POSTGRES_USER=onden -e POSTGRES_PASSWORD=onden \
            onden-ci-postgres:selftest postgres -c shared_preload_libraries='pg_stat_statements'
          for i in $(seq 1 60); do
            docker exec onden-drill-pg pg_isready -h 127.0.0.1 -U onden -d postgres >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs onden-drill-pg; exit 1

      - name: The restore drill's self-test (scripts/restore-drill-selftest.sh)
        run: bash scripts/restore-drill-selftest.sh postgres://onden:onden@localhost:5432/postgres

  frontend:
    name: Frontend — lint · typecheck · unit · build
    runs-on: ubuntu-latest
    needs: receipt
    if: needs.receipt.outputs.reused != 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.repository == 'oandy-rgb/Onden-open'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: packages/frontend
        run: npm run lint

      # astro sync first: astro:content + ImportMeta.env types are GENERATED
      # (.astro/types.d.ts) — on a fresh checkout tsc has nothing to resolve
      # them against and fails with TS2307/TS2339.
      # The heap limit is the one scripts/fast-lane.sh uses: the default runs out (exit 134).
      - name: Typecheck
        working-directory: packages/frontend
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: npx astro sync && npx tsc --noEmit

      # vitest is scoped to src/**/*.{test,spec} (e2e/ Playwright specs excluded).
      # No database here (the sync fault simulation runs in the backend job,
      # which has one), so this is an explicit no-database run.
      - name: Unit tests (no database)
        working-directory: packages/frontend
        run: npm run test:no-db

      - name: Build
        working-directory: packages/frontend
        run: npm run build

  # The three hosts of one backend (server, packaged desktop app, browser version) run the same script and are compared
  # step by step (packages/frontend/e2e/parity, docs/agents/testing.md). It was in no job, so it stayed broken for a week
  # (script failed at step 1 from migration 200 until #1811) and nobody saw it. Manual only, like the other heavy jobs.
  # Step 1 is the all-PGlite run (the three hosts share one database engine, so it catches host differences: packaging,
  # bridge, environment). Step 2 puts the Node host on this job's real Postgres (pgroonga, the image compose uses) and
  # compares the other two against it, so it also catches PGlite-vs-Postgres differences; it runs even when step 1 failed,
  # so one run shows both. desktop:check comes first because it builds the packaged app the desktop host opens.
  parity:
    name: Three-host parity (desktop · browser · Node on PGlite and on real Postgres)
    # Pinned: this job installs Chromium with the pinned Playwright (e2e/package.json), which refuses an Ubuntu newer than it
    # knows ("Playwright does not support chromium on ubuntu26.04-x64", first hosted run 2026-11-17). Move it with Playwright.
    runs-on: ubuntu-24.04
    needs: receipt
    if: needs.receipt.outputs.reused != 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.repository == 'oandy-rgb/Onden-open'))
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # What the Node host runs (packages/backend/dist), and the static folder the browser host opens.
      - name: Build packages and the browser version
        run: |
          npm run build -w packages/markdown
          npm run build -w packages/contract
          npm run build -w packages/site
          npm run build -w packages/backend
          npm run build:browser

      # Chromium for the browser host. The desktop host drives the Electron that desktop:install downloads.
      - name: Install Chromium
        working-directory: packages/frontend/e2e
        run: npm ci && npx playwright install --with-deps chromium

      # Ubuntu 24.04 stops unprivileged user namespaces, which Chromium's sandbox needs; the Electron app runs with its real
      # sandbox here (the host adds --no-sandbox only for root). Not yet seen running on a hosted runner: if the desktop step
      # fails to launch, look here first.
      - name: Allow the Electron sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # install + pack + desktop:test + smoke on the packaged app (scripts/desktopCheck.mjs); leaves release/linux-unpacked.
      - name: Desktop app check (builds the packaged app)
        run: npm run desktop:check

      - name: Parity — all PGlite
        run: xvfb-run -a npm run parity -- --hosts node,desktop,browser

      - name: Build Postgres image
        if: always()
        run: docker build -t onden-postgres ./docker/postgres

      - name: Start Postgres
        if: always()
        run: |
          docker run -d --name onden-pg -p 5432:5432 \
            -e POSTGRES_DB=onden -e POSTGRES_USER=onden -e POSTGRES_PASSWORD=onden \
            onden-postgres postgres -c shared_preload_libraries='pg_stat_statements'
          for i in $(seq 1 60); do
            # TCP on purpose, see the backend-postgres job: the init-time server answers on the socket only.
            docker exec onden-pg pg_isready -h 127.0.0.1 -U onden -d onden >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec onden-pg psql -U onden -d onden -c "CREATE DATABASE onden_test;"

      # The URL goes by flag, not by env: the desktop host passes its environment on to the packaged app, which must keep PGlite.
      # The Node host makes a fresh database on this server for the run and drops it after.
      - name: Parity — Node on real Postgres
        if: always()
        run: xvfb-run -a npm run parity -- --hosts node,desktop,browser --database-url postgres://onden:onden@localhost:5432/onden_test

      - name: Postgres logs (on failure)
        if: failure()
        run: docker logs onden-pg || true

  # Critical-path e2e on every run: the @critical subset (~24 tests — auth gate,
  # capture→task→daily loop, governance/approval, publish/site basics, smoke,
  # offline sync drain). Same self-contained run.sh stack as the full suite;
  # the --grep filter keeps it inside a PR-friendly budget. E2E_REQUIRE_ADMIN=1
  # turns the "needs admin; reset the stack" skips into hard failures so a
  # stale/misprovisioned stack can never produce a silently-green run.
  e2e-critical:
    name: Critical-path E2E (PR subset)
    runs-on: ubuntu-latest
    needs: receipt
    if: needs.receipt.outputs.reused != 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.repository == 'oandy-rgb/Onden-open'))
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Every e2e spec loads (runner layout, before the stack is built)
        working-directory: packages/frontend
        run: npm run check:specs

      - name: Critical e2e subset (build stack → drive Chromium → teardown)
        env:
          E2E_REQUIRE_ADMIN: "1"
        run: bash packages/frontend/e2e/fullstack/run.sh --grep @critical

  # Real-browser full-stack E2E — heavy (builds the compose stack + pulls the
  # playwright image), so only when asked (the `fullstack` input); every run
  # gets the e2e-critical subset above. run.sh is self-contained (isolated onden_test
  # stack on :5099, never the real onden) and tears down.
  # One job ran the whole suite serially (467 chromium tests ≈ 55 min on the cloud stack, past the old 30-minute
  # limit), so it is split into parallel jobs, each with its own stack. Together they select every test run.sh
  # selects with no arguments: the chromium project (4 shards by spec file), the `faults` project, and the
  # cross-engine projects. Shards split by file, so a spec must not depend on another spec's data.
  e2e-fullstack:
    name: Full-stack E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Asked for by a manual run's input, or by the pushed commit (`public-push.sh … --fullstack` writes `ci-fullstack: true`).
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.fullstack) ||
      (github.event_name == 'push' && github.repository == 'oandy-rgb/Onden-open' && contains(github.event.head_commit.message, 'ci-fullstack: true'))
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "chromium 1/4", args: "--project chromium --shard=1/4" }
          - { name: "chromium 2/4", args: "--project chromium --shard=2/4" }
          - { name: "chromium 3/4", args: "--project chromium --shard=3/4" }
          - { name: "chromium 4/4", args: "--project chromium --shard=4/4" }
          - { name: "faults", args: "--project faults" }
          - { name: "cross-engine", args: "--project firefox --project webkit --project mobile-chrome --project mobile-safari" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full-stack e2e (build stack → drive the browsers → teardown)
        env:
          E2E_REQUIRE_ADMIN: "1"
          E2E_ARGS: ${{ matrix.args }}
        # E2E_ARGS comes from the matrix above (not from user input); unquoted on purpose so it splits into flags.
        run: bash packages/frontend/e2e/fullstack/run.sh $E2E_ARGS

      # A red shard is only explainable from what the page showed: keep the text snapshots (no images) of each failure.
      - name: Keep the failure snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures-${{ strategy.job-index }}
          path: /tmp/pw-host-out/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7

  # ── The scheduled set (owner, 2026-11-22: 「加每天一次和每週一次就好」) ──────────────────────────────────────────
  # Checks that existed but that no job ran (scripts/ciReachLib.mjs finds them; its guard keeps the list empty). They run
  # when .github/workflows/scheduled.yml dispatches this workflow with `extended` (daily or weekly; never on push), or by
  # hand with `-f extended=daily`. Every run of them comments on one issue (scripts/ciScheduledReport.mjs).
  scheduled-unit:
    name: Scheduled — fuzz · Astro head · parity tool
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.extended == 'daily'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Fresh random inputs every night (owner 2026-11-18 「種子都隨機」): a red is a finding; the seed is in the log.
      - name: Fuzz tests (backend, frontend, markdown)
        run: npm run test:fuzz
      - name: Astro page tests
        if: success() || failure()
        working-directory: packages/frontend
        run: npm run test:astro
      - name: The parity tool's own tests
        if: success() || failure()
        run: npm run parity:test

  scheduled-browser:
    name: Scheduled — browser version (${{ matrix.name }})
    # Pinned like the parity job: the pinned Playwright cannot install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.extended == 'daily'
    timeout-minutes: ${{ matrix.timeout }}
    # Two halves on two runners: run-all.mjs alone takes ~50 minutes (main, 2026-11-22), and in one job the layout audit
    # behind it was cut off by the time limit. The feature scripts took 47, 49 and over 58 minutes on three runs (a slower
    # runner: the 2000-note workspace took 89 s instead of 67 s), so their half has 90.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: features, name: "feature scripts", timeout: 90 }
          - { part: pages, name: "slides · touch · layout audit · diagrams", timeout: 60 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the browser version
        run: |
          npm run build -w packages/markdown
          npm run build -w packages/contract
          npm run build -w packages/site
          npm run build:browser
      - name: Install the browsers
        working-directory: packages/frontend/e2e
        run: npm ci && npx playwright install --with-deps chromium webkit
      # Each step runs even when one before it failed, so one night shows every red.
      - name: Smoke and feature scripts (run-all.mjs)
        if: matrix.part == 'features'
        working-directory: packages/frontend
        # --require-engines: an engine that cannot start fails the step (on a developer's machine it is a skip).
        run: node e2e/browser-app/run-all.mjs --require-engines
      - name: Slide tables
        if: matrix.part == 'pages' && (success() || failure())
        working-directory: packages/frontend
        run: npm run e2e:slides
      - name: Touch hold
        if: matrix.part == 'pages' && (success() || failure())
        working-directory: packages/frontend
        run: npm run e2e:touch-hold
      - name: Layout audit (rules on the rendered pages, baseline e2e/layout-audit/baseline.json)
        if: matrix.part == 'pages' && (success() || failure())
        working-directory: packages/frontend
        run: npm run layout:audit
      - name: Layout audit and style census, their own tests
        if: matrix.part == 'pages' && (success() || failure())
        working-directory: packages/frontend
        run: npm run layout:audit:selftest && npm run style:census:selftest
      - name: Diagram layout in a real browser
        if: matrix.part == 'pages' && (success() || failure())
        run: node packages/frontend/e2e/diagrams/check.mjs "$RUNNER_TEMP/diagrams.png"

  # The WebKit / iPhone / iPad scan (playwright.webkit-scan.config.ts, the specs in e2e/webkitScanSpecs.ts) on the same stack as
  # the full-stack E2E. "E2E" in the name: the report counts reds already in known-red-baseline.json instead of listing them.
  scheduled-webkit:
    name: Scheduled — WebKit scan (E2E, Safari engine at desktop, iPhone and iPad sizes)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.extended == 'daily'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: WebKit scan (build stack → drive the browsers → teardown)
        working-directory: packages/frontend
        env:
          E2E_REQUIRE_ADMIN: "1"
        run: npm run e2e:webkit-scan
      - name: Keep the failure snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-scan-failures
          path: /tmp/pw-host-out/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7

  scheduled-weekly:
    name: Scheduled weekly — ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    if: github.event_name == 'workflow_dispatch' && inputs.extended == 'weekly'
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "mutation (backend)", runner: ubuntu-latest, db: true, dir: packages/backend, cmd: "npm run test:mutation" }
          - { name: "mutation (frontend)", runner: ubuntu-latest, db: false, dir: packages/frontend, cmd: "npm run test:mutation" }
          - { name: "mutation (markdown)", runner: ubuntu-latest, db: false, dir: packages/markdown, cmd: "npm run test:mutation" }
          - { name: "long property runs", runner: ubuntu-latest, db: true, dir: ".", cmd: "npm run test:props:long --workspaces --if-present" }
          - { name: "style census", runner: ubuntu-24.04, db: false, dir: ".", cmd: "npm run build:browser && npm ci --prefix packages/frontend/e2e && (cd packages/frontend/e2e && npx playwright install --with-deps chromium) && npm run style:census -w packages/frontend" }
          - { name: "bench", runner: ubuntu-latest, db: true, dir: ".", cmd: "npm run bench && npm run bench:check" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the packages the backend imports
        run: npm run build -w packages/markdown && npm run build -w packages/contract && npm run build -w packages/site
      - name: Test Postgres
        if: matrix.db
        uses: ./.github/actions/test-postgres
      # The mutation reports and the census report are files, kept as the run's artifacts (never committed).
      - name: ${{ matrix.name }}
        working-directory: ${{ matrix.dir }}
        env:
          DATABASE_URL: ${{ matrix.db && 'postgres://onden:onden@localhost:5432/onden_test' || '' }}
          # Without a database the skip gate (scripts/lib/skipGateReporter.mjs) wants to be told this is a no-database run.
          ONDEN_TESTS_WITHOUT_DATABASE: ${{ !matrix.db && '1' || '' }}
          BENCH_DATABASE_URL: postgres://onden:onden@localhost:5432/onden_bench
          ONDEN_TEST_DB_KEEP: "1"
        run: ${{ matrix.cmd }}
      - name: Keep the reports
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ strategy.job-index }}
          path: |
            packages/*/reports/mutation/
            packages/frontend/e2e/style-census/report.json
            bench-results.json
          if-no-files-found: ignore
          retention-days: 30

  # One issue collects every scheduled red: a comment per run (job, test names, seed lines, run link; no log text, which
  # could carry a note's words). Full-stack E2E reds already listed in packages/frontend/e2e/known-red-baseline.json are
  # counted, not listed, until main is green; that list only shrinks (scripts/ratchetLib.mjs).
  scheduled-report:
    name: Scheduled — report
    runs-on: ubuntu-latest
    needs: [receipt, guard, pairing-relay, backend, backend-postgres, restore-scripts, frontend, parity, e2e-critical, e2e-fullstack, scheduled-unit, scheduled-browser, scheduled-webkit, scheduled-weekly]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.extended != '' && github.repository == 'oandy-rgb/Onden-open'
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comment on the scheduled-checks issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          KIND: ${{ inputs.extended }}
        run: node scripts/ciScheduledReport.mjs
