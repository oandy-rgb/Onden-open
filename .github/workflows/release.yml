name: Release images

# 推 v* tag 時：建 postgres／backend／frontend 三個映像（amd64＋arm64）推到
# ghcr.io/oandy-rgb/onden-<名稱>:<tag>，穩定版同時更新 :latest，並建立 GitHub release。
# 本機備案：scripts/release.sh。規則：docs/agents/release.md。
#
# 每個平台用原生 runner 各建一次（不走 QEMU：前端 build 很吃記憶體），
# 再把各平台的 digest 合成同一個 tag 的 manifest。arm64 失敗不擋 amd64：
# merge 只合成有成功的平台。

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: oandy-rgb

jobs:
  build:
    name: ${{ matrix.image }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # arm64 若失敗，amd64 照常發布（見 merge job）
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [postgres, backend, frontend]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: postgres
            context: docker/postgres
            dockerfile: docker/postgres/Dockerfile
          - image: backend
            context: .
            dockerfile: packages/backend/docker/Dockerfile
          - image: frontend
            context: .
            dockerfile: packages/frontend/docker/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          # ONDEN_BUILD_ID = tag, identical for backend and frontend (ignored by postgres).
          # PUBLIC_API_BASE_URL empty, like compose.yaml (same-origin via nginx).
          build-args: |
            ONDEN_BUILD_ID=${{ github.ref_name }}
            PUBLIC_API_BASE_URL=
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/onden-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: manifest ${{ matrix.image }}
    needs: build
    # build 有 arm64 失敗時整體算 success（continue-on-error）；amd64 失敗則沒有 digest，這裡會報錯
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [postgres, backend, frontend]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/onden-${{ matrix.image }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ -n "$(ls)" ] || { echo "沒有任何平台的 digest"; exit 1; }
          tags=(--tag "$IMAGE:$VERSION")
          # 預發布（v0.2.0-rc.1）不更新 latest；latest 只指向穩定發布版本
          case "$VERSION" in *-*) ;; *) tags+=(--tag "$IMAGE:latest") ;; esac
          docker buildx imagetools create "${tags[@]}" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  release:
    name: GitHub release
    needs: merge
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 與 scripts/release.sh、CHANGELOG.md 同一支產生器：合併的 PR 標題＋新增的 migration
      - name: Generate release notes
        run: scripts/changelog.sh "${{ github.ref_name }}" --until "${{ github.sha }}" > "${RUNNER_TEMP}/notes.md"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --title "$TAG" --notes-file "${RUNNER_TEMP}/notes.md" "${flags[@]}"
