worker_processes auto;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  types { application/wasm wasm; }
  sendfile      on;
  keepalive_timeout 65;

  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   6;
  gzip_min_length   1024;
  gzip_types
    text/plain text/css text/javascript
    application/javascript application/json
    application/wasm image/svg+xml
    font/woff2;

  # X-Real-IP / X-Forwarded-For are overwritten with $onden_client_ip on every
  # proxied location below, never appended to: the backend's login rate limit
  # trusts X-Real-IP (authClientIp.ts), so a client-sent value must not pass.
  # If another trusted proxy or CDN sits in front of this nginx, take the real
  # client address from it (set_real_ip_from + real_ip_header) first.
  #
  # $onden_client_ip is $remote_addr, except on port 8081: the bundled Caddy
  # (compose profile `https`) connects there and sends the browser's address in
  # X-Real-IP. 8081 is never published to the host, so only containers on the
  # compose network can reach it; a client on port 80 cannot choose its IP.
  # (docs/self-host/https.md)
  map $server_port $onden_client_ip {
    8081    $http_x_real_ip;
    default $remote_addr;
  }

  access_log /var/log/nginx/access.log;

  # /site/* sets its own X-Frame-Options (SiteHead.astro); the app must never
  # be framed by another origin. An empty value makes add_header skip it.
  map $uri $frame_options {
    ~^/site/ "";
    default  DENY;
  }

  server {
    listen 80;
    # Only for the Caddy sidecar; not published by compose.yaml.
    listen 8081;

    # Security headers for every response. The upstreams may send their own
    # nosniff / Referrer-Policy (media, site pages); hide theirs so each
    # response carries one copy. No CSP here yet (separate rollout).
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    add_header X-Frame-Options $frame_options always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # SSE blind-tick stream — MUST NOT be buffered. With default buffering
    # nginx holds the frames until its proxy buffer fills, so the stream looks
    # dead to the browser (the classic SSE-behind-nginx trap). Long read
    # timeout because the connection is intentionally idle between ticks (the
    # backend writes a `:` heartbeat every ~25s, well under the 1h cap).
    # Exact-match location wins over the /api/ prefix below.
    location = /api/events/stream {
      proxy_pass http://backend:8787;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $onden_client_ip;
      proxy_set_header X-Forwarded-For $onden_client_ip;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    # Media upload (POST /api/media) — the one request allowed to be large.
    # client_max_body_size is @onden/markdown MAX_MEDIA_REQUEST_BYTES (the
    # largest per-type cap in mediaTypes.ts, video 500 MB, plus 1 MB for the
    # multipart envelope); the backend checks each type's own cap. The
    # frontend test uploadCaps.test.ts keeps both caps in this file equal to
    # the constants. The body is buffered here (to a temp file past the
    # in-memory buffer) before the backend sees it, so a slow upload holds no
    # backend connection; the longer proxy timeouts cover sharp re-encoding a
    # large image. GET /api/media/<id> falls through to /api/ below.
    location = /api/media {
      proxy_pass http://backend:8787;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $onden_client_ip;
      proxy_set_header X-Forwarded-For $onden_client_ip;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      client_max_body_size 501m;
    }

    # Backup restore upload (Settings › 你的資料 › 從備份還原) — a whole
    # workspace's zip. client_max_body_size is @onden/markdown
    # DEFAULT_MAX_BACKUP_REQUEST_BYTES (16 GB; uploadCaps.test.ts checks it).
    # A server run with ONDEN_MAX_BACKUP_MB set to another number needs the same number here.
    # NOT buffered here (proxy_request_buffering off): the body goes to the
    # backend as it arrives, so nginx never writes a 16 GB temp file for a
    # caller the backend would refuse, and the upload needs one copy of disk,
    # not two. The backend checks the signed-in person, the length cap and the
    # free disk space before it reads the body, then streams it to disk and
    # checks the archive itself (services/backupFile.ts, routes/backup.ts).
    location = /api/backup/restore/upload {
      proxy_pass http://backend:8787;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $onden_client_ip;
      proxy_set_header X-Forwarded-For $onden_client_ip;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      client_max_body_size 16384m;
    }

    # Stamped snapshot (GET /api/snapshot out, POST /api/snapshot in: copying the workspace to the owner's own other device). The answer to
    # the GET is a stream of lines the backend writes as it reads: with the default buffering nginx would hold it back (and spool it to a
    # temp file) and nothing could be shown as progress; it must not be cached either (it is the whole workspace in plain text; the backend
    # also answers Cache-Control: no-store). The POST body is as large as the workspace (about 55 MB of lines for 20,000 notes), far past
    # the 20 MB of /api/ below, and is NOT buffered here (proxy_request_buffering off) so the backend can refuse a caller that is not the
    # owner of an empty database before the body is read (services/stampedSnapshotStream.ts). The cap is the backup restore's.
    location = /api/snapshot {
      proxy_pass http://backend:8787;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $onden_client_ip;
      proxy_set_header X-Forwarded-For $onden_client_ip;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      gzip off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      client_max_body_size 16384m;
    }

    # Backend API — proxy directly to Hono without going through Astro.
    # client_max_body_size is @onden/markdown MAX_REQUEST_BYTES.
    location /api/ {
      proxy_pass http://backend:8787;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $onden_client_ip;
      proxy_set_header X-Forwarded-For $onden_client_ip;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      client_max_body_size 20m;
    }

    # Long-lived cache for hashed static assets
    location /_astro/ {
      proxy_pass http://frontend:80;
      proxy_set_header Host $host;
      # Hashed chunks are immutable, but only a real chunk: without `always`
      # the header goes on 2xx/3xx only. A 404/502 (a chunk gone after a
      # deploy, or the frontend restarting) must never be cached for a year.
      # The frontend container sends its own `max-age=0`; drop it so a chunk
      # carries one Cache-Control, not two that contradict each other.
      proxy_hide_header Cache-Control;
      add_header Cache-Control "public, max-age=31536000, immutable";
      # A location with its own add_header / proxy_hide_header does not inherit
      # the server-level ones.
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header Referrer-Policy;
      add_header X-Frame-Options $frame_options always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Everything else → Astro SSR node server
    location / {
      proxy_pass http://frontend:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $onden_client_ip;
      proxy_set_header X-Forwarded-For $onden_client_ip;
      proxy_read_timeout 60s;
    }
  }
}
