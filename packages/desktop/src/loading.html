<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
<title>Onden</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; font: 16px system-ui, "Noto Sans CJK TC", sans-serif; background: Canvas; color: CanvasText; }
  main { text-align: center; }
  h1 { font-size: 28px; margin: 0 0 12px; font-weight: 600; }
  p { margin: 0; opacity: .65; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: currentColor; margin: 0 3px; animation: b 1.2s infinite ease-in-out both; }
  .dot:nth-child(2) { animation-delay: .15s; } .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
</style>
</head>
<body><main><h1>Onden</h1><p>正在開啟…</p><p style="margin-top:16px"><span class="dot"></span><span class="dot"></span><span class="dot"></span></p><p id="first" style="margin-top:20px;font-size:13px"></p></main>
<script>/* 第一次開啟要建立資料庫，約十幾秒；5 秒後才說明，免得平常一閃而過的畫面多一行字。 */
setTimeout(function(){ document.getElementById("first").textContent = "第一次開啟要先建立資料庫，請稍等…"; }, 5000);</script>
</body>
</html>
