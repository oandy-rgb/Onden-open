apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onden
  namespace: onden
spec:
  rules:
    - host: onden.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: onden-backend
                port:
                  number: 8787
          - path: /health
            pathType: Exact
            backend:
              service:
                name: onden-backend
                port:
                  number: 8787
          - path: /
            pathType: Prefix
            backend:
              service:
                name: onden-frontend
                port:
                  number: 80
