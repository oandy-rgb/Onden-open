# Same-origin proxy on :5099, mirrors docker/nginx/nginx.conf with localhost upstreams.
pid /tmp/onden-run/nginx.pid;
error_log /tmp/onden-run/nginx-error.log warn;
worker_processes 2;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types { application/wasm wasm; }
  access_log off;
  client_body_temp_path /tmp/onden-run/nginx-body;
  proxy_temp_path /tmp/onden-run/nginx-proxy;
  fastcgi_temp_path /tmp/onden-run/nginx-fcgi;
  uwsgi_temp_path /tmp/onden-run/nginx-uwsgi;
  scgi_temp_path /tmp/onden-run/nginx-scgi;
  sendfile on;
  keepalive_timeout 65;
  gzip on; gzip_vary on; gzip_proxied any; gzip_comp_level 6; gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/wasm image/svg+xml font/woff2;
  server {
    listen 5099;
    location = /api/events/stream {
      proxy_pass http://127.0.0.1:8787;
      proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
      proxy_http_version 1.1; proxy_set_header Connection "";
      proxy_buffering off; proxy_cache off; gzip off;
      proxy_read_timeout 1h; proxy_send_timeout 1h;
    }
    location = /api/media {
      proxy_pass http://127.0.0.1:8787;
      proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 300s; proxy_send_timeout 300s; client_max_body_size 501m;
    }
    location = /api/backup/restore/upload {
      proxy_pass http://127.0.0.1:8787;
      proxy_http_version 1.1; proxy_request_buffering off;
      proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 600s; proxy_send_timeout 600s; client_max_body_size 16384m;
    }
    location /api/ {
      proxy_pass http://127.0.0.1:8787;
      proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 120s; proxy_send_timeout 120s; client_max_body_size 20m;
    }
    location /_astro/ {
      proxy_pass http://127.0.0.1:4321;
      proxy_set_header Host $host;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
      proxy_pass http://127.0.0.1:4321;
      proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 60s;
    }
  }
}
